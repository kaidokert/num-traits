[package]
authors = ["The Rust Project Developers"]
description = "Const-friendly numeric traits for generic mathematics (fork of num-traits)"
documentation = "https://docs.rs/const-num-traits"
homepage = "https://github.com/kaidokert/num-traits"
keywords = ["mathematics", "numerics"]
categories = ["algorithms", "science", "no-std"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kaidokert/num-traits"
name = "const-num-traits"
version = "0.1.0"
readme = "README.md"
# Include-list of the files that ship. Anything not listed here is never packaged.
include = [
    "/src",
    "/examples",
    "/tests",
    "/README.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]
edition = "2024"
rust-version = "1.86"

[package.metadata.docs.rs]
features = ["std", "ct"]
rustdoc-args = ["--generate-link-to-definition", "--cfg", "docsrs"]

[dependencies]
c0nst = "0.2.1"
libm = { version = "0.2.0", optional = true }
subtle = { version = "2.6", default-features = false, features = ["i128"], optional = true }

[features]
default = ["std"]
libm = ["dep:libm"]
std = []
nightly = ["c0nst/nightly"]
ct = ["dep:subtle"]
