[package]
authors = ["The Rust Project Developers"]
description = "Const-friendly numeric traits for generic mathematics (fork of num-traits)"
documentation = "https://docs.rs/const-num-traits"
homepage = "https://github.com/kaidokert/num-traits"
keywords = ["mathematics", "numerics"]
categories = ["algorithms", "science", "no-std"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kaidokert/num-traits"
name = "const-num-traits"
version = "0.1.0"
readme = "README.md"
build = "build.rs"
exclude = ["/ci/*", "/.github/*"]
edition = "2021"
rust-version = "1.86"

[package.metadata.docs.rs]
features = ["std"]
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
c0nst = "0.2.1"
libm = { version = "0.2.0", optional = true }
subtle = { version = "2.6", default-features = false, features = ["i128"], optional = true }

[features]
default = ["std"]
libm = ["dep:libm"]
std = []
nightly = ["c0nst/nightly"]
# nightly + exact mirrors of unstable std APIs (e.g. `FormatInto` over
# `core::fmt::NumBuffer`). Kept separate from `nightly` so const-traits-only
# builds aren't exposed to churn in the `int_format_into` lang feature.
nightly-std = ["nightly"]
ct = ["dep:subtle"]
# Opt-in zero-cost typestate proofs (e.g. `PowerOfTwo`) + their consuming ops.
# Purely additive; off by default.
typestate = []

# vestigial features, now always in effect
i128 = []

[build-dependencies]
autocfg = "1.2"
