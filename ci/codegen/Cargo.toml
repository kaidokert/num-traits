# Codegen check for the typestate accessors: see check.sh. Not part of the
# published crate (the package's `include` list leaves `ci/` out).
[package]
name = "typestate-codegen"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
const-num-traits = { path = "../..", default-features = false }

[profile.release]
opt-level = "s"
panic = "abort"
codegen-units = 1
