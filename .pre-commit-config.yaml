# Fast checks run on commit and re-run in CI. Cross-compilation, the
# beta/nightly toolchains, and the const surface are too heavy for a commit
# hook and live in .github/workflows/ci.yaml instead.
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: check-json
    -   id: check-yaml
    -   id: check-toml
    -   id: mixed-line-ending
        args: ["--fix=lf"]
    -   id: fix-byte-order-marker

# Feature-specific checks against the installed toolchain.
-   repo: local
    hooks:
    -   id: cargo-fmt
        name: cargo fmt --check
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
    -   id: cargo-clippy
        name: cargo clippy (std libm ct, -D warnings)
        entry: cargo clippy --all-targets --no-default-features --features "std libm ct" -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
    -   id: cargo-clippy-no-std
        name: cargo clippy (no_std libm ct, -D warnings)
        entry: cargo clippy --tests --no-default-features --features "libm ct" -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
    -   id: cargo-test
        name: cargo test (std libm ct)
        entry: cargo test --no-default-features --features "std libm ct"
        language: system
        types: [rust]
        pass_filenames: false
