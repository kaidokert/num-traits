name: CI
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  schedule:
    - cron: '0 0 * * 0' # 00:00 Sunday

jobs:

  gate:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: pre-commit/action@v3.0.1

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.86.0 # MSRV
          - stable
          - beta
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test
      - run: cargo test --no-default-features
      - run: cargo test --no-default-features --features "std libm ct"
      - run: cargo test --no-default-features --features "libm ct"

  nightly:
    name: Nightly (const surface)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo test --features "nightly"
      - run: cargo test --features "std libm ct nightly"

  cross:
    name: Cross
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i586-unknown-linux-gnu, thumbv6m-none-eabi
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      # i586 exercises the soft-float paths that SSE hides. The feature set is
      # spelled out because `--all-features` enables `nightly`, which needs an
      # unstable toolchain.
      - run: cargo test --target i586-unknown-linux-gnu --no-default-features --features "std libm ct"
      - run: cargo build --target thumbv6m-none-eabi --no-default-features
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features libm
      - run: cargo build --target thumbv6m-none-eabi --no-default-features --features ct

  success:
    name: Success
    runs-on: ubuntu-latest
    needs: [gate, test, nightly, cross]
    # A single required check for branch protection. `if: always()` and the
    # explicit result scan are needed because GitHub counts a job skipped by a
    # failed dependency as success.
    if: always()
    steps:
      - name: check if any dependency failed
        run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
